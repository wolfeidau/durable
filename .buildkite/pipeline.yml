steps:
  - group: ":mag: QA"
    key: quality_checks
    steps:
      - label: ":golangci-lint: lint"
        commands:
          - mise run check:tidy
          - golangci-lint run --verbose --timeout 3m
        # One volume per step, because concurrent jobs fork it and the last to pass replaces it.
        cache:
          name: go-lint
          paths:
            - /go-cache
        env:
          GOCACHE: /go-cache/build
          GOMODCACHE: /go-cache/mod
          GOLANGCI_LINT_CACHE: /go-cache/lint
        plugins:
          - mise#v1.1.5: ~

      - label: ":go: test"
        artifact_paths:
          - coverage.out
          - tests.json
        command: go test -race -count=1 -json -coverprofile=coverage.out -coverpkg=./... ./... > tests.json
        cache:
          name: go-test
          paths:
            - /go-cache
        env:
          GOCACHE: /go-cache/build
          GOMODCACHE: /go-cache/mod
          # The tests' go build inherits -race, so it reuses go test's packages and the real binary is checked too.
          GOFLAGS: -race
          # Each real-binary run would otherwise sleep 1s at exit.
          GORACE: atexit_sleep_ms=0
        plugins:
          - mise#v1.1.5: ~
          - wolfeidau/go-test-annotate#v1.0.0:
              file: tests.json

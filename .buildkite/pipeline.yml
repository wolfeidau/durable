steps:
  - group: ":mag: QA"
    key: quality_checks
    steps:
      - label: ":golangci-lint: lint"
        retry:
          automatic:
            # mise-cache exits 75 when GitHub downloads fail.
            - exit_status: 75
              limit: 2
        commands:
          - mise run check:tidy
          - mise run check:api
          - mise run check:schema
          - golangci-lint run --verbose --timeout 3m
        plugins:
          - ./.buildkite/plugins/mise-cache: ~
          - ./.buildkite/plugins/go-cache:
              name: go_lint

      - label: ":go: test"
        retry:
          automatic:
            - exit_status: 75
              limit: 2
        artifact_paths:
          - coverage.out
          - tests.json
        command: go test -race -count=1 -json -coverprofile=coverage.out -coverpkg=./... ./... > tests.json
        env:
          # The tests' go build inherits -race, so it reuses go test's packages and the real binary is checked too.
          GOFLAGS: -race
          # Each real-binary run would otherwise sleep 1s at exit.
          GORACE: atexit_sleep_ms=0
        plugins:
          - ./.buildkite/plugins/mise-cache: ~
          - wolfeidau/go-test-annotate#v1.0.0:
              file: tests.json
          - ./.buildkite/plugins/go-cache:
              name: go_test

      - label: ":bun: web"
        retry:
          automatic:
            - exit_status: 75
              limit: 2
        command: mise run check:web
        plugins:
          - ./.buildkite/plugins/mise-cache: ~

  # Runs alongside QA, because it spends no key and waiting on QA added about 1m30 to every branch build.
  - label: ":docker: e2e sandbox"
    retry:
      automatic:
        - exit_status: 75
          limit: 2
    if: build.branch != pipeline.default_branch
    command: mise run test:e2e
    plugins:
      - ./.buildkite/plugins/mise-cache: ~

  # Live model calls spend the key and run model-chosen commands, so only default-branch builds get it.
  - label: ":docker: e2e sandbox (live)"
    retry:
      automatic:
        - exit_status: 75
          limit: 2
    if: build.branch == pipeline.default_branch
    depends_on: quality_checks
    command: mise run test:e2e
    secrets:
      - OPENROUTER_API_KEY
    plugins:
      - ./.buildkite/plugins/mise-cache: ~

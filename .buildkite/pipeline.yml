steps:
  - group: ":mag: QA"
    key: quality_checks
    steps:
      - label: ":golangci-lint: lint"
        commands:
          - mise run check:tidy
          - mise run check:api
          - golangci-lint run --verbose --timeout 3m
        plugins:
          - mise#v1.1.5: ~
          - ./.buildkite/plugins/go-cache:
              name: go_lint

      - label: ":go: test"
        artifact_paths:
          - coverage.out
          - tests.json
        command: go test -race -count=1 -json -coverprofile=coverage.out -coverpkg=./... ./... > tests.json
        env:
          # The tests' go build inherits -race, so it reuses go test's packages and the real binary is checked too.
          GOFLAGS: -race
          # Each real-binary run would otherwise sleep 1s at exit.
          GORACE: atexit_sleep_ms=0
        plugins:
          - mise#v1.1.5: ~
          - wolfeidau/go-test-annotate#v1.0.0:
              file: tests.json
          - ./.buildkite/plugins/go-cache:
              name: go_test

  - label: ":docker: e2e sandbox"
    if: build.branch != pipeline.default_branch
    depends_on: quality_checks
    command: mise run test:e2e
    plugins:
      - mise#v1.1.5: ~

  # Live model calls spend the key and run model-chosen commands, so only default-branch builds get it.
  - label: ":docker: e2e sandbox (live)"
    if: build.branch == pipeline.default_branch
    depends_on: quality_checks
    command: mise run test:e2e
    secrets:
      - OPENROUTER_API_KEY
    plugins:
      - mise#v1.1.5: ~

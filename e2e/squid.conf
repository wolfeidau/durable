http_port 3128

acl allowed dstdomain .openrouter.ai github.com api.github.com codeload.github.com .githubusercontent.com
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed
http_access allow allowed
http_access deny all

cache deny all
# The image tails this file to stdout, so denials show in `docker compose logs`.
access_log stdio:/var/log/squid/access.log
pid_filename none

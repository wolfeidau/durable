[settings]
experimental = true
lockfile = true

[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
goreleaser = "2.19.0"
lefthook = "2.1.9"
buf = "1.75.0"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.12"
"go:connectrpc.com/connect/cmd/protoc-gen-connect-go" = "1.21.1"
bun = "1.4.4"

[tasks."check:tidy"]
run = "go mod tidy -diff"

[tasks."gen:api"]
# The web client is generated from the same API, so it never drifts from the Go code.
run = """
buf generate
mise run web:gen
"""

[tasks."check:api"]
run = """
buf lint
buf generate
# git diff ignores untracked files, so check the status instead.
test -z "$(git status --porcelain api/)" || { git status --porcelain api/; exit 1; }
"""

[tasks."check:lint"]
run = "golangci-lint run --timeout 3m"

[tasks."test:e2e"]
run = """
# Show denials before teardown removes the proxy and its log.
trap 'rc=$?; if [ $rc -ne 0 ]; then docker compose -f e2e/compose.yaml logs --no-log-prefix proxy | grep TCP_DENIED || true; fi; docker compose -f e2e/compose.yaml down; exit $rc' EXIT
docker compose -f e2e/compose.yaml run --rm --build tests
"""

[tasks."web:gen"]
dir = "{{config_root}}/web"
# protoc-gen-es has a node shebang, so run buf under bun.
run = """
bun install --frozen-lockfile
bun run --bun buf generate ../api --path ../api/durable/v1
"""

[tasks."web:build"]
dir = "{{config_root}}/web"
run = """
set -e
bun install --frozen-lockfile
rm -rf ../internal/server/ui/dist
bun build src/main.tsx --outdir ../internal/server/ui/dist --target browser --production
cp index.html ../internal/server/ui/dist/index.html
"""

[tasks."check:web"]
dir = "{{config_root}}/web"
run = """
set -e
bun install --frozen-lockfile
bun run --bun buf generate ../api --path ../api/durable/v1
# The status check also catches untracked files, which a diff ignores.
test -z "$(git status --porcelain src/gen)" || { git status --porcelain src/gen; exit 1; }
bunx tsc --noEmit
bunx tsc --noEmit -p tsconfig.test.json
bun test
mise run web:build
"""

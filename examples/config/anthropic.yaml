# yaml-language-server: $schema=https://raw.githubusercontent.com/wolfeidau/durable/main/schema/durable-server.schema.json
# Anthropic direct, over anthropic-messages (the only protocol it allows).
provider:
  name: anthropic
  # Leave model unset for the built-in default Claude model.
  # model: claude-sonnet-5-5
  api_key: op://<vault>/<item>/<field>
git:
  author: durable <durable@localhost>
  hosts:
    github:
      # Dev only: gh's token reaches every repo your login can. Elsewhere use a fine-grained PAT,
      # op://<vault>/<item>/<field>; see "Git host tokens" in the README.
      token: gh
environments:
  default:
    image: durable-worker:dev
    grants: [github-api]


syntax = "proto3";

package durable.worker.v1;

option go_package = "github.com/wolfeidau/durable/api/durable/worker/v1;workerv1";

// ToolService runs tools inside a sandbox. The server connects in; the sandbox never dials out.
service ToolService {
  // Info reports the worker's environment, without its token.
  rpc Info(InfoRequest) returns (InfoResponse);
  // ListTools reports the name, description and schema of each tool. The server checks them against its own catalog.
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  // Execute streams zero or more deltas, then exactly one result. It is idempotent per call_id:
  // a known id streams nothing new and returns the stored result.
  rpc Execute(ExecuteRequest) returns (stream ExecuteResponse);
  // Cancel cancels a running call; the call then finishes with whatever the tool returns, which
  // is stored as its result. An unknown or finished call_id is a no-op.
  rpc Cancel(CancelRequest) returns (CancelResponse);
  // Result returns the stored result of a finished call.
  rpc Result(ResultRequest) returns (ResultResponse);
  // Stdio runs one process and pipes its stdin and output over the stream. The first request must be a start;
  // ending the stream stops the process. It knows nothing of what the process speaks.
  rpc Stdio(stream StdioRequest) returns (stream StdioResponse);
  // ReadFile reads a regular file inside the workspace, never following a symlink out of it.
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  // ReadDir lists a directory inside the workspace, in name order.
  rpc ReadDir(ReadDirRequest) returns (ReadDirResponse);
  // Stat describes a file or directory inside the workspace, following symlinks that stay inside it.
  rpc Stat(StatRequest) returns (StatResponse);
}

// InfoRequest asks for the worker's environment.
message InfoRequest {}

// InfoResponse describes the worker's process.
message InfoResponse {
  // hostname is the worker's host name.
  string hostname = 1;
  // uid is the user the worker runs as.
  int64 uid = 2;
  // cwd is the worker's working directory.
  string cwd = 3;
  // root is the workspace root the tools are confined to.
  string root = 4;
  // env is the worker's environment, minus its token.
  map<string, string> env = 5;
}

// ListToolsRequest asks for the worker's tools.
message ListToolsRequest {}

// ToolInfo is what a worker claims about one tool. Read-only and replay metadata stay with the server.
message ToolInfo {
  // name is the tool name.
  string name = 1;
  // description is the text shown to the model.
  string description = 2;
  // input_schema is the JSON schema of the tool input.
  bytes input_schema = 3;
}

// ListToolsResponse lists the worker's tools in order.
message ListToolsResponse {
  // tools are the configured tools.
  repeated ToolInfo tools = 1;
}

// ExecuteRequest starts or rejoins one tool call.
message ExecuteRequest {
  // call_id identifies the call; it keys idempotency and cancellation.
  string call_id = 1;
  // name is the tool to run.
  string name = 2;
  // input is the tool's JSON input.
  bytes input = 3;
  // stream_output asks for live output as delta messages before the result.
  bool stream_output = 4;
}

// ExecuteResponse is a live delta or the final result.
message ExecuteResponse {
  // event is a delta, or the result that ends the stream.
  oneof event {
    // delta is a piece of live tool output.
    string delta = 1;
    // result is the final outcome of the call.
    ExecuteResult result = 2;
  }
}

// ExecuteResult is the outcome of a call.
message ExecuteResult {
  // output is the tool output, or the error text when is_error is set.
  string output = 1;
  // is_error is set when the tool returned an error.
  bool is_error = 2;
}

// CancelRequest names the call to cancel.
message CancelRequest {
  // call_id identifies the call.
  string call_id = 1;
}

// CancelResponse is empty.
message CancelResponse {}

// ResultRequest names the call whose result is wanted.
message ResultRequest {
  // call_id identifies the call.
  string call_id = 1;
}

// ResultResponse carries the stored result, if the call has finished.
message ResultResponse {
  // found is false for an unknown or still running call.
  bool found = 1;
  // output is the tool output, or the error text when is_error is set.
  string output = 2;
  // is_error is set when the tool returned an error.
  bool is_error = 3;
}

// StdioRequest starts the process, then carries its stdin. Closing the request side closes stdin.
message StdioRequest {
  // event is the start, which must come first, or a piece of stdin.
  oneof event {
    // start describes the process to run.
    StdioStart start = 1;
    // stdin is bytes for the process's stdin.
    bytes stdin = 2;
  }
}

// StdioStart describes a process to run beside the worker.
message StdioStart {
  // command is the executable, looked up on the worker's PATH.
  string command = 1;
  // args are the command's arguments.
  repeated string args = 2;
  // env is added to the worker's environment, which has no token.
  map<string, string> env = 3;
  // workspace_cwd runs the process in the workspace root; otherwise it gets a temporary directory.
  bool workspace_cwd = 4;
}

// StdioResponse is a piece of output, or the exit code that ends the stream.
message StdioResponse {
  // event is output, or the exit code, which is sent last.
  oneof event {
    // stdout is bytes from the process's stdout.
    bytes stdout = 1;
    // stderr is bytes from the process's stderr.
    bytes stderr = 2;
    // exit_code is the process's exit code, or -1 when a signal ended it.
    int32 exit_code = 3;
  }
}

// ReadFileRequest names a file to read.
message ReadFileRequest {
  // path is relative to the workspace root and must stay inside it.
  string path = 1;
  // max_bytes bounds the read; the worker caps it at 1 MiB.
  int64 max_bytes = 2;
}

// ReadFileResponse carries the bytes read.
message ReadFileResponse {
  // data is at most max_bytes of the file.
  bytes data = 1;
  // truncated is set when the file is longer than data.
  bool truncated = 2;
}

// ReadDirRequest names a directory to list.
message ReadDirRequest {
  // path is relative to the workspace root and must stay inside it; "." is the root.
  string path = 1;
}

// DirEntry is one entry of a directory.
message DirEntry {
  // name is the entry's base name.
  string name = 1;
  // mode is the entry's own type and permission bits, as an io/fs FileMode; a symlink is not followed.
  uint32 mode = 2;
}

// ReadDirResponse lists a directory.
message ReadDirResponse {
  // entries are sorted by name, at most 1024.
  repeated DirEntry entries = 1;
  // truncated is set when the directory has more entries than were returned.
  bool truncated = 2;
}

// StatRequest names the path to describe.
message StatRequest {
  // path is relative to the workspace root and must stay inside it; "." is the root.
  string path = 1;
}

// StatResponse describes a path.
message StatResponse {
  // name is the base name.
  string name = 1;
  // mode is the io/fs FileMode of the path.
  uint32 mode = 2;
  // size is the length in bytes of a regular file.
  int64 size = 3;
}

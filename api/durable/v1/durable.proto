syntax = "proto3";

package durable.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/wolfeidau/durable/api/durable/v1;durablev1";

// SessionService drives one durable session. session_id is the 16-hex session directory name.
service SessionService {
  // Submit is exactly-once per request_id.
  rpc Submit(SubmitRequest) returns (SubmitResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc DecideApproval(DecideApprovalRequest) returns (DecideApprovalResponse);
  // WatchEvents replays committed events after after_seq, then follows new ones.
  // A stale epoch, or an after_seq past the newest seq, returns FAILED_PRECONDITION with an
  // EpochMismatch error detail. The client then discards its state and replays from 0.
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse);
  // ListSessions lists the sessions under the server's home, without opening any.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // CreateSession creates a session or returns the existing one: by cwd and name for a directory session,
  // by request_id for an empty one, by repo, branch and name for a repo one. A repo session clones its branch before
  // this returns, and a failed clone returns FAILED_PRECONDITION with git's last line.
  // A server that can't create sessions, for example a missing provider key, returns
  // FAILED_PRECONDITION and logs the detail.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  // GetServerInfo reports which workspace kinds CreateSession accepts: EMPTY and REPO for a sandboxed server, else DIRECTORY.
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);
  // ListNetworkEvents lists the network requests the session's sandbox proxy allowed or denied, with a coverage
  // report that says what the list cannot show. It is read-only and never opens the sandbox or the session.
  // An unknown session returns NOT_FOUND, a session with no sandbox returns FAILED_PRECONDITION, and a malformed
  // cursor, or one this server cannot resume, returns INVALID_ARGUMENT.
  rpc ListNetworkEvents(ListNetworkEventsRequest) returns (ListNetworkEventsResponse);
}

// Workspace is the kind of workspace a session runs in.
enum Workspace {
  WORKSPACE_UNSPECIFIED = 0;
  // DIRECTORY is a host directory, picked by cwd.
  WORKSPACE_DIRECTORY = 1;
  // EMPTY is an empty sandbox workspace with no host directory.
  WORKSPACE_EMPTY = 2;
  // REPO is a sandbox workspace holding a clone of a git repository branch.
  WORKSPACE_REPO = 3;
}

message GetServerInfoRequest {}

message GetServerInfoResponse {
  // workspaces lists the kinds CreateSession accepts.
  repeated Workspace workspaces = 1;
  // environments lists the sandbox environments CreateSession accepts; empty for a server without a sandbox.
  repeated EnvironmentInfo environments = 2;
  // settings are the effective server settings in display order; display-only, and values never include secret references.
  repeated Setting settings = 3;
  // warnings are the config warnings the server logged at startup.
  repeated string warnings = 4;
  // grants is the network grant catalog environments can name.
  repeated GrantInfo grants = 5;
}

// Setting is one effective server setting and where its value came from.
message Setting {
  string field = 1;
  string value = 2;
  string source = 3;
}

// GrantInfo is a network grant environments can name.
message GrantInfo {
  string name = 1;
  string summary = 2;
  repeated string binaries = 3;
  // hosts are the endpoints the grant opens, as host:port or host:port/path.
  repeated string hosts = 4;
}

// EnvironmentInfo is a sandbox environment: a worker image and the network grants a session gets.
message EnvironmentInfo {
  string name = 1;
  string image = 2;
  repeated string grants = 3;
  // "ask" or "auto"; empty means ask.
  string approvals = 4;
}

message CreateSessionRequest {
  // cwd must be an absolute path to an existing directory, and must be empty for an empty workspace.
  string cwd = 1;
  // name defaults to "default", as in durable chat, for a directory; an empty session stays unnamed.
  string name = 2;
  // workspace defaults to DIRECTORY.
  Workspace workspace = 3;
  // request_id is required for an empty workspace and must be a random value of at least 16 characters; a retry with the
  // same one returns the same session.
  string request_id = 4;
  // repo is required for a repo workspace: a URL or github.com/owner/name.
  string repo = 5;
  // branch is required for a repo workspace.
  string branch = 6;
  // environment names a sandbox environment from GetServerInfo. Empty means "default", or the only environment when there
  // is exactly one. It applies to empty and repo workspaces only, and the first create wins: a create that finds the
  // session already there returns it with its own environment.
  string environment = 7;
}

message CreateSessionResponse {
  SessionInfo session = 1;
  // created is false when the session already existed.
  bool created = 2;
}

message ListSessionsRequest {
  // refresh_sandbox_status triggers an immediate non-blocking background refresh of sandbox status even within TTL.
  bool refresh_sandbox_status = 1;
}

message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
  // warnings name session.json files that were skipped.
  repeated string warnings = 2;
  // sandbox_snapshot carries freshness metadata for sandboxed sessions; unset when no session is sandboxed.
  SandboxSnapshot sandbox_snapshot = 3;
}

// SandboxStatus is the lifecycle state of a session's pinned sandbox.
enum SandboxStatus {
  // UNSPECIFIED means the session is not sandboxed (no sandbox.json pin).
  SANDBOX_STATUS_UNSPECIFIED = 0;
  // UNKNOWN is a non-negative initial or unobserved state for a sandboxed session
  // before any gateway snapshot has succeeded.
  SANDBOX_STATUS_UNKNOWN = 1;
  SANDBOX_STATUS_RUNNING = 2;
  SANDBOX_STATUS_STARTING = 3;
  SANDBOX_STATUS_STOPPING = 4;
  SANDBOX_STATUS_STOPPED = 5;
  SANDBOX_STATUS_ERROR = 6;
  // MISSING is only set when an observed gateway snapshot omits the pinned sandbox.
  SANDBOX_STATUS_MISSING = 7;
}

// SandboxSnapshot reports freshness metadata for the sandbox statuses in ListSessionsResponse.
message SandboxSnapshot {
  // observed_at is when the cached snapshot was last fetched; unset before the first successful fetch.
  google.protobuf.Timestamp observed_at = 1;
  // refreshing is true while a background refresh is in flight.
  bool refreshing = 2;
  // stale is true when observed_at is unset, older than the server's freshness window,
  // invalidated by a local lifecycle change, or the last refresh failed.
  bool stale = 3;
  // error is a generic message when the last refresh failed; previously cached statuses remain populated.
  string error = 4;
}

message SessionInfo {
  // id is the session_id other RPCs take.
  string id = 1;
  // cwd is empty for an empty workspace.
  string cwd = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  // pending_approvals counts calls waiting for a decision, including in a session that is not open.
  int32 pending_approvals = 5;
  // unfinished_submissions counts queued plus running submissions; it may lag while another process writes.
  int32 unfinished_submissions = 6;
  Workspace workspace = 7;
  // repo is the canonical repository, such as github.com/owner/name, for a repo workspace.
  string repo = 8;
  string branch = 9;
  // environment is the sandbox environment the session was created with; empty for a directory session or one from before environments.
  string environment = 10;
  // last_submission_status is the status of the newest submission, or UNSPECIFIED when the session has none.
  SubmissionStatus last_submission_status = 11;
  // sandbox_status is the sandbox lifecycle state for a sandboxed session, or UNSPECIFIED for a directory session.
  SandboxStatus sandbox_status = 12;
}

message SubmitRequest {
  string session_id = 1;
  string request_id = 2;
  string text = 3;
}

message SubmitResponse {
  Submission submission = 1;
}

message CancelRequest {
  string session_id = 1;
  string request_id = 2;
}

message CancelResponse {
  Submission submission = 1;
}

message DecideApprovalRequest {
  string session_id = 1;
  int64 approval_seq = 2;
  bool allow = 3;
  // by is free text; there is no user identity.
  string by = 4;
}

message DecideApprovalResponse {
  Approval approval = 1;
}

message WatchEventsRequest {
  string session_id = 1;
  // epoch identifies one copy of the session; empty on the first watch.
  string epoch = 2;
  int64 after_seq = 3;
  // include_deltas streams live deltas with the events. Deltas are best-effort and not durable.
  // Within one stream a delta follows every event up to its last_seq and precedes any later event,
  // and the subscription starts before the response headers. After an overflow, text is skipped until
  // the next RESET and tool output loses only the dropped chunks. Dropping a delta whose last_seq is
  // below the last applied event's seq is only a safeguard.
  bool include_deltas = 4;
}

message WatchEventsResponse {
  oneof item {
    Event event = 1;
    Heartbeat heartbeat = 2;
    Delta delta = 3;
  }
}

message Heartbeat {}

// Delta is a live view of work in progress; the committed events stay authoritative.
message Delta {
  // last_seq is the newest committed seq when the delta was produced.
  int64 last_seq = 1;
  DeltaKind kind = 2;
  int64 submission = 3;
  // call_id is set for DELTA_KIND_TOOL_OUTPUT only.
  string call_id = 4;
  string text = 5;
}

enum DeltaKind {
  DELTA_KIND_UNSPECIFIED = 0;
  // RESET starts a model attempt, so a client drops partial text from an earlier one.
  DELTA_KIND_RESET = 1;
  DELTA_KIND_TEXT = 2;
  DELTA_KIND_TOOL_OUTPUT = 3;
}

enum SubmissionStatus {
  SUBMISSION_STATUS_UNSPECIFIED = 0;
  SUBMISSION_STATUS_QUEUED = 1;
  SUBMISSION_STATUS_RUNNING = 2;
  SUBMISSION_STATUS_DONE = 3;
  SUBMISSION_STATUS_FAILED = 4;
  SUBMISSION_STATUS_CANCELLED = 5;
}

enum ApprovalStatus {
  APPROVAL_STATUS_UNSPECIFIED = 0;
  APPROVAL_STATUS_PENDING = 1;
  APPROVAL_STATUS_ALLOWED = 2;
  APPROVAL_STATUS_DECLINED = 3;
  APPROVAL_STATUS_CANCELLED = 4;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_SUBMISSION = 1;
  EVENT_KIND_MESSAGE = 2;
  EVENT_KIND_CALL_STARTED = 3;
  EVENT_KIND_CALL_REPLAYED = 4;
  EVENT_KIND_CALL_DONE = 5;
  EVENT_KIND_COMPACTED = 6;
  EVENT_KIND_COMPACTION_FAILED = 7;
  EVENT_KIND_APPROVAL_REQUESTED = 8;
  EVENT_KIND_APPROVAL_DECIDED = 9;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_ASSISTANT = 2;
  ROLE_TOOL = 3;
}

message Submission {
  int64 seq = 1;
  string request_id = 2;
  string text = 3;
  SubmissionStatus status = 4;
  // result is the final assistant text when status is done.
  string result = 5;
  // error is the reason when status is failed.
  string error = 6;
}

message Approval {
  int64 seq = 1;
  int64 submission = 2;
  ToolCall call = 3;
  bool rewritten = 4;
  ApprovalStatus status = 5;
  string decided_by = 6;
}

// ToolCall omits input when a gate rewrote it, because the rewrite can hold secrets.
message ToolCall {
  string id = 1;
  string name = 2;
  // input is the JSON arguments, byte for byte.
  bytes input = 3;
}

// Message omits Raw: provider content is replayed server side only.
message Message {
  Role role = 1;
  string text = 2;
  repeated ToolCall tool_calls = 3;
  string tool_call_id = 4;
  bool is_error = 5;
  int64 context_tokens = 6;
  // note marks text the harness wrote in the user's turn, such as a cancellation notice, not the user.
  bool note = 7;
  // usage is set on assistant replies from this version on.
  Usage usage = 8;
}

// Usage is the metered cost of one model reply.
message Usage {
  // input_tokens counts uncached input only.
  int64 input_tokens = 1;
  int64 cache_read_tokens = 2;
  int64 cache_write_tokens = 3;
  // output_tokens includes reasoning_tokens.
  int64 output_tokens = 4;
  int64 reasoning_tokens = 5;
  double cost_usd = 6;
  // cost_source is "provider", "estimate", or empty when the cost is unknown.
  string cost_source = 7;
  string model = 8;
  // context_window is 0 when unknown.
  int64 context_window = 9;
  // duration_ms is the successful model attempt, not retries.
  int64 duration_ms = 10;
}

message Event {
  // seq is the resume cursor within one epoch.
  int64 seq = 1;
  string epoch = 2;
  EventKind kind = 3;
  // submission is the submission seq.
  int64 submission = 4;
  SubmissionStatus status = 5;
  string error = 6;
  Message message = 7;
  ToolCall call = 8;
  // rewritten means a gate changed the call input, which call then omits.
  bool rewritten = 9;
  bool is_error = 10;
  int64 approval_seq = 11;
  // approval is PENDING on approval_requested, and the answer on approval_decided.
  ApprovalStatus approval = 12;
  string decided_by = 13;
  // request_id is set on the queued submission event only.
  string request_id = 14;
  // at is when the event committed; unset on events from before it was recorded.
  google.protobuf.Timestamp at = 15;
}

// EpochMismatch is the FAILED_PRECONDITION error detail that carries the session's current epoch.
message EpochMismatch {
  string epoch = 1;
  int64 last_seq = 2;
}

message ListNetworkEventsRequest {
  string session_id = 1;
  // since is the start of the window: a duration back from now, or an absolute time. Default 24h.
  // The response coverage.since reports the window actually used.
  oneof since {
    google.protobuf.Duration since_ago = 2;
    google.protobuf.Timestamp since_time = 3;
  }
  // after is the next_cursor of an earlier response. Empty returns the newest limit events in the window.
  // The server keeps no state for a cursor: it names a position in the telemetry store's insertion order.
  // With GATEWAY_LOG there is no cursor: poll without after.
  string after = 4;
  // limit is the most events to return. Default and maximum 1000; 0 means the default.
  int32 limit = 5;
}

message ListNetworkEventsResponse {
  // events are oldest first by (time, id) when after is empty or cursor_reset is set, and for GATEWAY_LOG. With after they are
  // in storage order, which can include times earlier than events already returned, because the gateway's exporter
  // retries failed batches. The client should merge them into its list and sort by (time, id).
  repeated NetworkEvent events = 1;
  NetworkCoverage coverage = 2;
  // next_cursor resumes after everything stored so far: for a first load, the newest event the store held when it was
  // read; when resuming, the last event returned. With no events it repeats the request's after. It is empty for
  // GATEWAY_LOG, so each poll re-reads the log and moves to the store once the store has decisions.
  string next_cursor = 3;
  // truncated means limit left events out. Without after, older events in the window were left out; with after,
  // newer events remain and the next request should follow immediately.
  bool truncated = 4;
  // cursor_reset means after no longer matches the store, because the rows it named were deleted and their ids reused.
  // The events are a first load: replace the list, do not append.
  bool cursor_reset = 5;
}

// NetworkEvent is one network request the sandbox proxy allowed or denied.
message NetworkEvent {
  google.protobuf.Timestamp time = 1;
  // id is unique per event and orders events with the same time. It is the telemetry uid for the store source, and a
  // hash of the decision's content for the gateway log source, which has no uid.
  string id = 2;
  bool allowed = 3;
  // kind is "NET" or "HTTP".
  string kind = 4;
  // activity is "OPEN" or "REFUSE" for NET; empty for HTTP.
  string activity = 5;
  // binary is the NET process path; empty when no process is known.
  string binary = 6;
  // method is the HTTP method; empty for NET.
  string method = 7;
  // host is host:port for NET (no port for DNS refusals), host for HTTP.
  string host = 8;
  // path is the HTTP path without the query.
  string path = 9;
  // pattern is the path with versioned, numeric and hash-like segments shown as "*", so repeated requests group.
  string pattern = 10;
  // policy is the policy that decided; empty when none.
  string policy = 11;
  string reason = 12;
}

enum NetworkSource {
  NETWORK_SOURCE_UNSPECIFIED = 0;
  // STORE is the server's telemetry store, fed by the sandbox gateway over OTLP.
  NETWORK_SOURCE_STORE = 1;
  // GATEWAY_LOG is the gateway's own log, which keeps only its most recent lines.
  NETWORK_SOURCE_GATEWAY_LOG = 2;
}

// NetworkDrop is a count of events lost before or during receipt.
message NetworkDrop {
  int64 dropped = 1;
  // since is the start of the earliest gap that contributed to dropped.
  google.protobuf.Timestamp since = 2;
}

// NetworkCoverage says what the events cannot show. An absent or zero field means the server found nothing to report,
// except where noted.
message NetworkCoverage {
  NetworkSource source = 1;
  // source_bounded is set for GATEWAY_LOG: the source holds only recent lines, so events older than its start are
  // missing whatever the window asked for.
  bool source_bounded = 2;
  // resumable is false for GATEWAY_LOG, which issues no cursor: each poll re-reads the log from the window start, and
  // ids come from content, so use them to dedupe.
  bool resumable = 3;
  // store_available is false when the server has no telemetry store, so the fields below that come from the store are
  // empty because they are unknown, not because nothing was lost.
  bool store_available = 4;
  // store_empty means the store had no decisions for this sandbox in the window, so the gateway log was read instead.
  bool store_empty = 5;
  // gateway_error is set when the gateway log was needed and could not be read. The detail is in the server log.
  string gateway_error = 6;
  // gateway_log_start is the time of the log's oldest decision, set when it is after since: earlier events are missing.
  google.protobuf.Timestamp gateway_log_start = 7;
  // history_start is the sandbox's earliest stored decision, set when it is after since: the store did not record
  // anything earlier.
  google.protobuf.Timestamp history_start = 8;
  // dropped_own counts events the gateway's exporter dropped for this sandbox before they were sent.
  NetworkDrop dropped_own = 9;
  // dropped_gateway_wide counts events dropped for the whole gateway, so some may belong to this sandbox.
  NetworkDrop dropped_gateway_wide = 10;
  // dropped_unknown counts events dropped for sandboxes the store has no named event for, so some may belong to this sandbox.
  NetworkDrop dropped_unknown = 11;
  // unattributed counts decisions that had no sandbox or event id, so they cannot be shown for any sandbox. It is
  // counted per UTC day, so it covers all of unattributed_from_day.
  int64 unattributed = 12;
  // unattributed_from_day is the UTC day (YYYY-MM-DD) the unattributed count starts from; empty without a store.
  string unattributed_from_day = 13;
  // retention is how long the store keeps raw events; zero without a store.
  google.protobuf.Duration retention = 14;
  // pruned is set when the window starts before the retention cutoff, so older events were deleted.
  bool pruned = 15;
  // since is the window start the server used, which is the default when the request gave none.
  google.protobuf.Timestamp since = 16;
}
